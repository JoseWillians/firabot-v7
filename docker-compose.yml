services:
  mysql:
    image: mysql:8.0
    container_name: firabot-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: firabot
      MYSQL_USER: firabot
      MYSQL_PASSWORD: firabot123
    ports:
      - "3306:3306"
    volumes:
      - firabot_mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  firabot_mysql_data: